server:
  port: 8080

spring:
  # 本地私密配置（真实 api-key 等），文件不进 git；optional=文件不存在时不报错
  config:
    import: optional:application-local.yml
  datasource:
    url: jdbc:mysql://localhost:3306/ai_knowledge_base_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD:123@$abc}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 智谱 GLM 大模型配置（兼容 OpenAI 接口格式）
glm:
  api-key: demo
  base-url: https://open.bigmodel.cn/api/coding/paas/v4
  model: glm-5.3-flash
  embedding-model: embedding-3


agent:
  # 对话记忆：保留最近 N 轮消息作为上下文
  memory-max-messages: 20
  # RAG 检索返回的最大文档块数
  rag-top-k: 3
  # 向量检索相似度阈值（低于该值视为不相关，降级为关键词搜索）
  rag-similarity-threshold: 0.58
  # 工具调用最大循环次数（防止无限循环）
  max-tool-iterations: 5
  # 工具执行的工作目录（Shell/文件操作限制在此目录内）
  workspace-dir: ${user.home}/ai-knowledge-base-test-workspace
  # 知识库上传限制（防止 OOM；分块上限低于实际分块数会静默截断文档）
  max-upload-size-kb: 20480
  max-chunks-per-document: 3000
  max-vector-search-chunks: 4000
  max-embeddings-per-document: 3000
