server:
  # 端口分配:ai-knowledge-base-test 8080、agentscope-test 8081、langgraph4j-test 8082、
  # langchain4j-test 8083、spring-ai-test 8084,本模块的 Web 示例用 8085
  port: 8085

# DashScope(阿里云百炼)模型配置的默认值(可提交 git)。
# 真实 api-key 放在 application-local.yml(已被 .gitignore 排除),不要写在这里。
# 读取优先级:-D 系统属性 > 环境变量 > application-local.yml > 本文件
dashscope:
  api-key: demo
  base-url: https://dashscope.aliyuncs.com
  model: qwen-plus

spring:
  application:
    name: spring-ai-alibaba-test
  # 可选导入本地私密配置(已被 .gitignore 排除;没有这个文件也不报错)。
  # 用 config.import 显式引入,mvn spring-boot:run 就不用再带 -Dspring-boot.run.profiles=local
  config:
    import: optional:classpath:/application-local.yml
  ai:
    dashscope:
      # spring-ai-alibaba-starter-dashscope 的自动配置前缀。
      # 这里用占位符引用 dashscope.*,让 Web 示例(自动配置)和 CLI 示例(DashScopeConfig 手动读)共用同一份配置
      api-key: ${dashscope.api-key}
      base-url: ${dashscope.base-url}
      chat:
        options:
          model: ${dashscope.model}
          temperature: 0.7
